<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>NEXORA — Messages</title>
  <meta name="description" content="Chat with buyers and sellers on NEXORA.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #0ea5e9;
      --cyan-dark: #0284c7;
      --cyan-light: #f0f9ff;
      --charcoal: #1e293b;
      --slate: #334155;
      --muted: #64748b;
      --border: #e2e8f0;
      --off-white: #f8fafc;
      --white: #ffffff;
      --green: #10b981;
      --green-bg: #f0fdf4;
      --green-border: #bbf7d0;
      --purple: #8b5cf6;
      --purple-bg: #f5f3ff;
      --red: #ef4444;
      --red-bg: #fef2f2;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Inter', sans-serif; background: var(--off-white); color: var(--charcoal); }
    button { cursor: pointer; border: none; background: none; font-family: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }

    /* ── LAYOUT ── */
    .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    .topbar {
      background: var(--white); border-bottom: 1px solid var(--border);
      height: 56px; flex-shrink: 0; display: flex; align-items: center;
      padding: 0 12px 0 16px; gap: 10px;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 1.1rem;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .topbar-title { margin-left: auto; font-size: .82rem; font-weight: 600; color: var(--muted); }
    .back-btn {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--off-white); border: 1.5px solid var(--border);
    }
    .main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* ── INBOX ── */
    .inbox { padding: 8px 0 90px; }
    .conv {
      display: flex; gap: 12px; align-items: center; width: 100%; text-align: left;
      padding: 12px 16px; background: var(--white); border-bottom: 1px solid var(--border);
    }
    .conv:active { background: var(--off-white); }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: .9rem;
    }
    .conv-body { flex: 1; min-width: 0; }
    .conv-top { display: flex; align-items: baseline; gap: 8px; }
    .conv-name { font-weight: 700; font-size: .9rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-time { font-size: .7rem; color: var(--muted); flex-shrink: 0; }
    .conv-bottom { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
    .conv-last { font-size: .8rem; color: var(--muted); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv.unread .conv-last { color: var(--charcoal); font-weight: 600; }
    .badge {
      min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
      background: var(--cyan); color: white; font-size: .68rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .role-chip { font-size: .62rem; font-weight: 700; padding: 2px 6px; border-radius: 5px; flex-shrink: 0; }
    .role-seller { background: var(--purple-bg); color: var(--purple); }
    .role-buyer  { background: var(--cyan-light); color: var(--cyan-dark); }

    /* ── THREAD ── */
    .thread-head { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
    .thread-head .avatar { width: 36px; height: 36px; font-size: .78rem; }
    .thread-name { font-weight: 700; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .thread-sub { font-size: .7rem; color: var(--muted); }
    .order-chip {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
      margin: 0; padding: 9px 16px; background: var(--white);
      border-bottom: 1px solid var(--border); font-size: .76rem; color: var(--slate);
    }
    .order-chip strong { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .order-chip .go { color: var(--cyan-dark); font-weight: 700; flex-shrink: 0; }
    .safety {
      margin: 12px 16px 4px; padding: 9px 12px; border-radius: 10px;
      background: var(--green-bg); border: 1px solid var(--green-border);
      font-size: .74rem; line-height: 1.5; color: #047857; display: flex; gap: 8px;
    }
    .msgs { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
    .day { align-self: center; font-size: .68rem; font-weight: 600; color: var(--muted); background: var(--white); border: 1px solid var(--border); padding: 3px 10px; border-radius: 10px; margin: 10px 0 6px; }
    .bubble {
      max-width: 82%; padding: 8px 12px 6px; border-radius: 16px;
      font-size: .88rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
    }
    .bubble a { text-decoration: underline; word-break: break-all; }
    .bubble .t { display: block; text-align: right; font-size: .62rem; margin-top: 3px; opacity: .75; }
    .mine { align-self: flex-end; background: var(--cyan); color: white; border-bottom-right-radius: 4px; }
    .mine a { color: white; }
    .theirs { align-self: flex-start; background: var(--white); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .theirs a { color: var(--cyan-dark); }
    .sending { opacity: .6; }

    .composer {
      flex-shrink: 0; background: var(--white); border-top: 1px solid var(--border);
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: flex-end;
    }
    .composer textarea {
      flex: 1; resize: none; border: 1.5px solid var(--border); border-radius: 20px;
      padding: 10px 14px; font-family: inherit; font-size: .9rem; line-height: 1.35;
      max-height: 120px; min-height: 42px; color: var(--charcoal); background: var(--off-white);
    }
    .composer textarea:focus { outline: none; border-color: var(--cyan); background: var(--white); }
    .send-btn {
      width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
      background: var(--cyan); color: white; display: flex; align-items: center; justify-content: center;
    }
    .send-btn:disabled { background: var(--border); }
    .send-err { font-size: .74rem; color: var(--red); padding: 0 16px 6px; background: var(--white); display: none; }

    /* ── STATES ── */
    .empty-state {
      min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 32px 24px; text-align: center;
    }
    .empty-icon { font-size: 3rem; }
    .empty-state h3 { font-size: 1.05rem; font-weight: 700; }
    .empty-state p { font-size: .85rem; color: var(--muted); max-width: 270px; line-height: 1.5; }
    .btn-cta { padding: 12px 24px; border-radius: 12px; background: var(--cyan); color: white; font-size: .9rem; font-weight: 700; margin-top: 4px; }
    .loading { padding: 48px 16px; text-align: center; color: var(--muted); font-size: .88rem; }
    .spin { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--cyan); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── BOTTOM NAV ── */
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); border-top: 1px solid var(--border); display: flex; z-index: 200; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 4px 10px; gap: 3px; font-size: .65rem; font-weight: 600; color: var(--muted); }
    .nav-item.active { color: var(--cyan); }
    .nav-item svg { width: 22px; height: 22px; }
    .in-thread .nav-bar { display: none; }
  </style>
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar">
    <span class="logo">NEXORA</span>
    <span class="topbar-title">Messages</span>
  </div>
  <div class="main" id="main">
    <div class="loading"><div class="spin"></div>Loading…</div>
  </div>
  <div id="composerSlot"></div>
</div>

<nav class="nav-bar" id="navBar"></nav>

<script>
  var SUPABASE_URL = 'https://tzzhbzaxoodxbcezcynw.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_0Ri0jxyq0AhmIXDInpVi1g_QqqAlOVX';

  var supa, me, myRole, myName;
  var conv = null;           // open conversation
  var msgs = [];             // messages in open conversation
  var channel = null;
  var pollTimer = null;
  var COLORS = ['#0ea5e9', '#8b5cf6', '#10b981', '#f59e0b', '#ef4444', '#6366f1', '#14b8a6'];

  // ── INIT ──────────────────────────────────────────────────────────────
  (function init() {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload = async function() {
      supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      var { data: { session } } = await supa.auth.getSession();
      if (!session) { location.href = 'auth.html?next=' + encodeURIComponent('messages.html' + location.search); return; }
      me = session.user;
      var meta = me.user_metadata || {};
      myRole = meta.role === 'seller' ? 'seller' : 'buyer';
      myName = (meta.full_name || (me.email || '').split('@')[0] || '').trim().slice(0, 60);
      renderNav();
      route();
    };
    s.onerror = function() { showMainError('Could not connect. Check your internet and refresh.'); };
    document.head.appendChild(s);
    window.addEventListener('popstate', route);
  })();

  function route() {
    var p = new URLSearchParams(location.search);
    stopLive();
    if (p.get('user') || p.get('gig')) return startConversation(p.get('user'), p.get('order'), p.get('gig'));
    if (p.get('c')) return openThread(p.get('c'));
    showInbox();
  }

  // ── START / FIND A CONVERSATION ───────────────────────────────────────
  async function startConversation(otherId, orderId, gigId) {
    setMainLoading('Opening chat…');
    var buyerId, sellerId, sellerName = null, buyerName = null;

    if (orderId) {
      var { data: o } = await supa.from('orders').select('id, buyer_id, seller_id, gig_id').eq('id', orderId).maybeSingle();
      if (!o) return showMainError('That order could not be found.');
      buyerId = o.buyer_id; sellerId = o.seller_id; gigId = gigId || o.gig_id;
    }
    if (gigId) {
      var { data: g } = await supa.from('gigs').select('seller_id, seller_name').eq('id', gigId).maybeSingle();
      if (g) {
        sellerName = g.seller_name || null;
        if (!sellerId) { sellerId = g.seller_id; buyerId = me.id; }
      }
    }
    if (!buyerId || !sellerId) {
      if (!otherId) return showMainError('Could not work out who to message.');
      if (myRole === 'seller') { sellerId = me.id; buyerId = otherId; }
      else { buyerId = me.id; sellerId = otherId; }
    }
    if (buyerId === sellerId) return showMainError("You can't send messages to yourself.");
    if (me.id !== buyerId && me.id !== sellerId) return showMainError("You're not part of this order.");

    if (me.id === buyerId) buyerName = myName || null; else sellerName = myName || null;

    var c = await findConv(buyerId, sellerId);
    if (!c) {
      var row = { buyer_id: buyerId, seller_id: sellerId, buyer_name: buyerName, seller_name: sellerName };
      if (orderId) row.order_id = orderId;
      var res = await supa.from('conversations').insert(row).select().single();
      if (res.error) {
        c = await findConv(buyerId, sellerId);   // someone created it at the same moment
        if (!c) return showMainError('Could not start the chat: ' + res.error.message);
      } else c = res.data;
    } else if (orderId && c.order_id !== orderId) {
      await supa.from('conversations').update({ order_id: orderId }).eq('id', c.id);
      c.order_id = orderId;
    }
    history.replaceState(null, '', 'messages.html?c=' + encodeURIComponent(c.id));
    openThread(c.id, c);
  }

  async function findConv(buyerId, sellerId) {
    var { data } = await supa.from('conversations').select('*')
      .eq('buyer_id', buyerId).eq('seller_id', sellerId).limit(1);
    return data && data[0] ? data[0] : null;
  }

  // ── INBOX ─────────────────────────────────────────────────────────────
  async function showInbox() {
    document.body.classList.remove('in-thread');
    conv = null;
    document.getElementById('composerSlot').innerHTML = '';
    document.getElementById('topbar').innerHTML = '<span class="logo">NEXORA</span><span class="topbar-title">Messages</span>';
    setMainLoading('Loading messages…');
    await loadInbox();
    pollTimer = setInterval(function() { if (!document.hidden) loadInbox(true); }, 15000);
  }

  async function loadInbox(quiet) {
    var { data: convs, error } = await supa.from('conversations').select('*')
      .order('last_message_at', { ascending: false, nullsFirst: false }).limit(100);
    if (error) { if (!quiet) showMainError(error.message); return; }

    var unread = {};
    var { data: un } = await supa.from('messages').select('conversation_id')
      .eq('read', false).neq('sender_id', me.id).limit(1000);
    (un || []).forEach(function(m) { unread[m.conversation_id] = (unread[m.conversation_id] || 0) + 1; });

    var main = document.getElementById('main');
    if (!convs || !convs.length) {
      main.innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div><h3>No messages yet</h3>' +
        '<p>' + (myRole === 'seller'
          ? 'When a buyer messages you about a gig or an order, the chat appears here.'
          : 'Open a gig and tap "Message seller" to ask a question before you order.') + '</p>' +
        (myRole === 'seller' ? '' : '<button class="btn-cta" onclick="location.href=\'browse.html\'">Browse Gigs</button>') +
        '</div>';
      return;
    }

    main.innerHTML = '<div class="inbox">' + convs.map(function(c) {
      var other = otherOf(c);
      var n = unread[c.id] || 0;
      return '<button class="conv' + (n ? ' unread' : '') + '" onclick="goThread(\'' + escHtml(c.id) + '\')">' +
        avatarHtml(other.name, other.id) +
        '<div class="conv-body">' +
          '<div class="conv-top"><span class="conv-name">' + escHtml(other.name) + '</span>' +
            '<span class="role-chip ' + (other.role === 'Seller' ? 'role-seller' : 'role-buyer') + '">' + other.role + '</span>' +
            '<span class="conv-time">' + escHtml(shortTime(c.last_message_at || c.created_at)) + '</span></div>' +
          '<div class="conv-bottom"><span class="conv-last">' + escHtml(c.last_message || 'No messages yet') + '</span>' +
            (n ? '<span class="badge">' + (n > 99 ? '99+' : n) + '</span>' : '') + '</div>' +
        '</div></button>';
    }).join('') + '</div>';
  }

  function goThread(id) {
    history.pushState(null, '', 'messages.html?c=' + encodeURIComponent(id));
    stopLive();
    openThread(id);
  }

  // ── THREAD ────────────────────────────────────────────────────────────
  async function openThread(id, preloaded) {
    document.body.classList.add('in-thread');
    setMainLoading('Loading chat…');

    var c = preloaded;
    if (!c) {
      var { data } = await supa.from('conversations').select('*').eq('id', id).maybeSingle();
      c = data;
    }
    if (!c) { document.body.classList.remove('in-thread'); return showMainError('This chat could not be found.'); }
    conv = c;

    // Keep my display name on the conversation up to date
    var myCol = me.id === c.buyer_id ? 'buyer_name' : 'seller_name';
    if (myName && c[myCol] !== myName) {
      var upd = {}; upd[myCol] = myName;
      supa.from('conversations').update(upd).eq('id', c.id).then(function() {});
      c[myCol] = myName;
    }

    var other = otherOf(c);
    document.getElementById('topbar').innerHTML =
      '<button class="back-btn" onclick="backToInbox()" aria-label="Back">' +
        '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>' +
      '<div class="thread-head">' + avatarHtml(other.name, other.id) +
        '<div style="min-width:0"><div class="thread-name">' + escHtml(other.name) + '</div>' +
        '<div class="thread-sub">' + other.role + '</div></div></div>';

    document.getElementById('composerSlot').innerHTML =
      '<div class="send-err" id="sendErr"></div>' +
      '<div class="composer">' +
        '<textarea id="msgInput" rows="1" maxlength="4000" placeholder="Write a message…" oninput="autoGrow(this)"></textarea>' +
        '<button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send">' +
          '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>' +
        '</button>' +
      '</div>';

    var { data: rows, error } = await supa.from('messages').select('*')
      .eq('conversation_id', c.id).order('created_at', { ascending: true }).limit(500);
    if (error) return showMainError(error.message);
    msgs = rows || [];

    await renderThread();
    markRead();
    startLive();
  }

  async function renderThread() {
    var orderChip = '';
    if (conv.order_id) {
      var { data: o } = await supa.from('orders').select('id, gig_title, status').eq('id', conv.order_id).maybeSingle();
      if (o) {
        var page = me.id === conv.seller_id ? 'seller-orders.html' : 'orders.html';
        orderChip = '<a class="order-chip" href="' + page + '">📦 <strong>Order #' + escHtml(String(o.id).slice(0, 8).toUpperCase()) +
          ' · ' + escHtml(o.gig_title || 'Gig order') + '</strong><span class="go">View</span></a>';
      }
    }
    document.getElementById('main').innerHTML = orderChip +
      '<div class="safety"><span>🔒</span><span>Keep payments and file deliveries on NEXORA. Payments made outside the platform are not covered by escrow protection.</span></div>' +
      '<div class="msgs" id="msgs"></div>';
    drawMessages();
  }

  function drawMessages() {
    var box = document.getElementById('msgs');
    if (!box) return;
    if (!msgs.length) {
      box.innerHTML = '<div class="empty-state" style="min-height:30vh"><div class="empty-icon">👋</div><p>Say hello and describe what you need.</p></div>';
      return;
    }
    var html = '', lastDay = '';
    msgs.forEach(function(m) {
      var d = new Date(m.created_at);
      var day = dayLabel(d);
      if (day !== lastDay) { html += '<div class="day">' + escHtml(day) + '</div>'; lastDay = day; }
      var mine = m.sender_id === me.id;
      html += '<div class="bubble ' + (mine ? 'mine' : 'theirs') + (m._sending ? ' sending' : '') + '">' + linkify(m.content) +
        (m.attachment_url && /^https?:\/\//.test(m.attachment_url) ? '\n<a href="' + escHtml(m.attachment_url) + '" target="_blank" rel="noopener noreferrer">📎 Attachment</a>' : '') +
        '<span class="t">' + escHtml(m._sending ? 'Sending…' : clock(d)) + '</span></div>';
    });
    box.innerHTML = html;
    var main = document.getElementById('main');
    main.scrollTop = main.scrollHeight;
  }

  async function sendMessage() {
    var input = document.getElementById('msgInput');
    var text = input.value.trim();
    if (!text || !conv) return;
    var btn = document.getElementById('sendBtn');
    var err = document.getElementById('sendErr');
    err.style.display = 'none';
    btn.disabled = true;

    var temp = { id: 'tmp-' + Date.now(), sender_id: me.id, content: text, created_at: new Date().toISOString(), _sending: true };
    msgs.push(temp);
    input.value = ''; autoGrow(input);
    if (msgs.length === 1) await renderThread(); else drawMessages();

    var { data, error } = await supa.from('messages')
      .insert({ conversation_id: conv.id, sender_id: me.id, content: text }).select().single();
    btn.disabled = false;
    msgs = msgs.filter(function(m) { return m.id !== temp.id; });

    if (error) {
      input.value = text; autoGrow(input);
      err.textContent = 'Message not sent: ' + error.message;
      err.style.display = 'block';
    } else if (!msgs.some(function(m) { return m.id === data.id; })) {
      msgs.push(data);
    }
    drawMessages();
    input.focus();
  }

  async function markRead() {
    if (!conv) return;
    await supa.from('messages').update({ read: true })
      .eq('conversation_id', conv.id).eq('read', false).neq('sender_id', me.id);
  }

  // ── LIVE UPDATES (realtime + backup polling) ──────────────────────────
  function startLive() {
    if (!conv) return;
    var id = conv.id;
    try {
      channel = supa.channel('chat-' + id)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'conversation_id=eq.' + id },
          function(payload) { addIncoming([payload.new]); })
        .subscribe();
    } catch (e) { channel = null; }
    pollTimer = setInterval(async function() {
      if (document.hidden || !conv) return;
      var real = msgs.filter(function(m) { return !m._sending; });
      var since = real.length ? real[real.length - 1].created_at : '1970-01-01T00:00:00Z';
      var { data } = await supa.from('messages').select('*').eq('conversation_id', id)
        .gt('created_at', since).order('created_at', { ascending: true });
      if (data && data.length) addIncoming(data);
    }, 6000);
  }

  function addIncoming(rows) {
    var added = false;
    rows.forEach(function(r) {
      if (!r || !conv || r.conversation_id !== conv.id) return;
      if (msgs.some(function(m) { return m.id === r.id; })) return;
      if (r.sender_id === me.id && msgs.some(function(m) { return m._sending && m.content === r.content; })) return;
      msgs.push(r); added = true;
    });
    if (!added) return;
    msgs.sort(function(a, b) { return new Date(a.created_at) - new Date(b.created_at); });
    if (document.getElementById('msgs') && msgs.length === rows.length) renderThread(); else drawMessages();
    markRead();
  }

  function stopLive() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    if (channel) { try { supa.removeChannel(channel); } catch (e) {} channel = null; }
  }

  function backToInbox() {
    stopLive();
    history.pushState(null, '', 'messages.html');
    showInbox();
  }

  // ── NAV ───────────────────────────────────────────────────────────────
  function renderNav() {
    var icons = {
      home: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
      gigs: '<path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
      orders: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
      browse: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
      msgs: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
      profile: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'
    };
    var items = myRole === 'seller'
      ? [['seller-dashboard.html', 'home', 'Home'], ['create-gig.html', 'gigs', 'Gigs'], ['seller-orders.html', 'orders', 'Orders'], ['messages.html', 'msgs', 'Messages']]
      : [['browse.html', 'browse', 'Browse'], ['orders.html', 'orders', 'Orders'], ['messages.html', 'msgs', 'Messages'], ['buyer-dashboard.html', 'profile', 'Profile']];
    document.getElementById('navBar').innerHTML = items.map(function(i) {
      return '<a href="' + i[0] + '" class="nav-item' + (i[1] === 'msgs' ? ' active' : '') + '">' +
        '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">' + icons[i[1]] + '</svg>' + i[2] + '</a>';
    }).join('');
  }

  // ── HELPERS ───────────────────────────────────────────────────────────
  function otherOf(c) {
    if (me.id === c.buyer_id) return { id: c.seller_id, name: c.seller_name || 'Seller', role: 'Seller' };
    return { id: c.buyer_id, name: c.buyer_name || 'Buyer', role: 'Buyer' };
  }

  function avatarHtml(name, id) {
    var parts = String(name || '?').trim().split(/\s+/);
    var ini = (parts[0][0] || '?') + (parts.length > 1 ? parts[parts.length - 1][0] : '');
    var h = 0; String(id || name).split('').forEach(function(ch) { h = (h * 31 + ch.charCodeAt(0)) >>> 0; });
    return '<div class="avatar" style="background:' + COLORS[h % COLORS.length] + '">' + escHtml(ini.toUpperCase()) + '</div>';
  }

  function clock(d) {
    try { return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; }
  }
  function dayLabel(d) {
    var t = new Date(); var y = new Date(Date.now() - 86400000);
    if (d.toDateString() === t.toDateString()) return 'Today';
    if (d.toDateString() === y.toDateString()) return 'Yesterday';
    return d.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: d.getFullYear() === t.getFullYear() ? undefined : 'numeric' });
  }
  function shortTime(s) {
    if (!s) return '';
    var d = new Date(s); if (isNaN(d)) return '';
    return d.toDateString() === new Date().toDateString() ? clock(d) : d.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
  }

  function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }

  function setMainLoading(t) { document.getElementById('main').innerHTML = '<div class="loading"><div class="spin"></div>' + escHtml(t) + '</div>'; }
  function showMainError(msg) {
    document.getElementById('composerSlot').innerHTML = '';
    document.getElementById('main').innerHTML = '<div class="empty-state"><div class="empty-icon">😕</div><h3>Something went wrong</h3><p>' + escHtml(msg) + '</p>' +
      '<button class="btn-cta" onclick="location.href=\'messages.html\'">Back to Messages</button></div>';
  }

  function escHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function linkify(s) {
    return escHtml(s).replace(/https?:\/\/[^\s<]+/g, function(url) {
      return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
    });
  }
</script>
