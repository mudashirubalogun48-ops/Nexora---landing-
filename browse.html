<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA — Browse Gigs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #0ea5e9;
      --cyan-dark: #0284c7;
      --cyan-light: #f0f9ff;
      --charcoal: #1e293b;
      --slate: #334155;
      --muted: #64748b;
      --border: #e2e8f0;
      --off-white: #f8fafc;
      --white: #ffffff;
      --green: #10b981;
      --green-bg: #f0fdf4;
      --orange: #f59e0b;
      --purple: #8b5cf6;
      --purple-bg: #f5f3ff;
      --red: #ef4444;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--off-white); color: var(--charcoal); min-height: 100vh; padding-bottom: 80px; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; }

    /* NAV */
    .nav {
      background: var(--white); border-bottom: 1px solid var(--border);
      height: 60px; display: flex; align-items: center;
      padding: 0 16px; gap: 10px;
      position: sticky; top: 0; z-index: 100;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.2rem; font-weight: 800;
      letter-spacing: -.03em; color: var(--charcoal); flex-shrink: 0;
    }
    .logo span {
      display: inline-block; width: 7px; height: 7px;
      background: var(--cyan); border-radius: 50%;
      margin-left: 2px; vertical-align: middle; margin-bottom: 3px;
    }
    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--cyan); color: white;
      font-size: .75rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Grotesk', sans-serif; cursor: pointer; flex-shrink: 0;
    }

    /* SEARCH BAR */
    .search-wrap {
      padding: 14px 16px 10px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 60px; z-index: 99;
    }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: var(--off-white); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 0 12px; height: 44px;
    }
    .search-box svg { color: var(--muted); flex-shrink: 0; }
    .search-box input {
      border: none; background: none; outline: none;
      font-family: 'Inter', sans-serif; font-size: .92rem;
      color: var(--charcoal); width: 100%;
    }
    .search-box input::placeholder { color: var(--muted); }
    .search-clear {
      background: none; border: none; color: var(--muted);
      font-size: 1.1rem; padding: 0 2px; cursor: pointer;
      display: none;
    }

    /* CATEGORY PILLS */
    .cats-wrap {
      overflow-x: auto; display: flex; gap: 8px;
      padding: 10px 16px 0; scrollbar-width: none;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .cats-wrap::-webkit-scrollbar { display: none; }
    .cat-pill {
      flex-shrink: 0; padding: 6px 14px;
      border-radius: 20px; font-size: .82rem; font-weight: 600;
      border: 1.5px solid var(--border);
      color: var(--slate); background: var(--white);
      transition: all .15s;
    }
    .cat-pill.active {
      background: var(--charcoal); color: var(--white); border-color: var(--charcoal);
    }

    /* SORT BAR */
    .sort-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 4px;
    }
    .result-count { font-size: .82rem; color: var(--muted); }
    .sort-select {
      font-size: .82rem; color: var(--slate); font-family: 'Inter', sans-serif;
      border: 1.5px solid var(--border); border-radius: 8px;
      padding: 5px 10px; background: var(--white); outline: none; cursor: pointer;
    }

    /* GIG GRID */
    .gig-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 8px 16px 16px;
    }
    @media (max-width: 380px) {
      .gig-grid { grid-template-columns: 1fr; }
    }

    .gig-card {
      background: var(--white); border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden; cursor: pointer;
      transition: box-shadow .15s, transform .1s;
      display: flex; flex-direction: column;
    }
    .gig-card:active { transform: scale(.98); }

    .gig-thumb {
      width: 100%; aspect-ratio: 4/3;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; flex-shrink: 0;
    }
    .gig-body { padding: 10px 10px 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; }

    .gig-seller-row { display: flex; align-items: center; gap: 6px; }
    .seller-avatar {
      width: 20px; height: 20px; border-radius: 50%;
      font-size: .6rem; font-weight: 700; color: white;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .seller-name { font-size: .75rem; color: var(--muted); font-weight: 500; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .verified { flex-shrink: 0; }
    .verified { font-size: .65rem; color: var(--green); font-weight: 700; }

    .gig-title {
      font-size: .82rem; font-weight: 600; color: var(--charcoal);
      line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .gig-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .gig-price { font-size: .82rem; font-weight: 700; color: var(--charcoal); }
    .gig-price span { font-weight: 400; color: var(--muted); font-size: .72rem; }
    .gig-days { font-size: .72rem; color: var(--muted); }

    /* EMPTY STATE */
    .empty {
      text-align: center; padding: 48px 24px;
      grid-column: 1 / -1;
    }
    .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-title { font-weight: 700; font-size: 1rem; color: var(--charcoal); margin-bottom: 6px; }
    .empty-sub { color: var(--muted); font-size: .88rem; line-height: 1.5; }

    /* SKELETON LOADER */
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .skel-card {
      background: var(--white); border-radius: 12px; border: 1px solid var(--border); overflow: hidden;
    }
    .skel-thumb { width: 100%; aspect-ratio: 4/3; }
    .skel-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .skel-line { height: 10px; border-radius: 4px; }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--white); border-top: 1px solid var(--border);
      height: 64px; z-index: 100;
    }
    .bnav-items { display: flex; justify-content: space-around; height: 100%; }
    .bnav-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      font-size: .65rem; font-weight: 600; color: var(--muted);
      transition: color .15s;
    }
    .bnav-item.active { color: var(--cyan); }
    .bnav-item svg { width: 22px; height: 22px; }

    /* BADGE on nav icon */
    .nav-icon {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--off-white); border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); position: relative; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- TOP NAV -->
  <nav class="nav">
    <a class="logo" href="index.html" style="text-decoration:none;">NEXORA<span></span></a>
    <div class="nav-right" id="nav-right">
      <a class="nav-icon" href="messages.html" aria-label="Messages">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </a>
      <a class="avatar" id="nav-avatar" href="profile.html" aria-label="My profile" style="overflow:hidden;text-decoration:none;">?</a>
    </div>
  </nav>

  <!-- SEARCH -->
  <div class="search-wrap">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search-input" placeholder="Search gigs, skills, services…" autocomplete="off">
      <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <!-- CATEGORY PILLS -->
  <div class="cats-wrap" id="cats-wrap">
    <button class="cat-pill active" data-cat="all">All</button>
    <button class="cat-pill" data-cat="graphic-design">Graphics &amp; Design</button>
    <button class="cat-pill" data-cat="programming">Programming &amp; Tech</button>
    <button class="cat-pill" data-cat="content-writing">Writing</button>
    <button class="cat-pill" data-cat="video-animation">Video &amp; Animation</button>
    <button class="cat-pill" data-cat="digital-marketing">Marketing</button>
    <button class="cat-pill" data-cat="ai-services">AI Services</button>
    <button class="cat-pill" data-cat="music-audio">Music &amp; Audio</button>
    <button class="cat-pill" data-cat="business">Business</button>
    <button class="cat-pill" data-cat="consulting">Consulting</button>
  </div>

  <!-- SORT BAR -->
  <div class="sort-bar">
    <span class="result-count" id="result-count">Loading…</span>
    <select class="sort-select" id="sort-select" onchange="applyFilters()">
      <option value="newest">Newest first</option>
      <option value="price_asc">Price: low to high</option>
      <option value="price_desc">Price: high to low</option>
    </select>
  </div>

  <!-- GIG GRID -->
  <div class="gig-grid" id="gig-grid">
    <!-- skeleton placeholders -->
    <div class="skel-card"><div class="skel-thumb skeleton"></div><div class="skel-body"><div class="skel-line skeleton" style="width:60%"></div><div class="skel-line skeleton" style="width:90%"></div><div class="skel-line skeleton" style="width:45%"></div></div></div>
    <div class="skel-card"><div class="skel-thumb skeleton"></div><div class="skel-body"><div class="skel-line skeleton" style="width:55%"></div><div class="skel-line skeleton" style="width:85%"></div><div class="skel-line skeleton" style="width:40%"></div></div></div>
    <div class="skel-card"><div class="skel-thumb skeleton"></div><div class="skel-body"><div class="skel-line skeleton" style="width:65%"></div><div class="skel-line skeleton" style="width:80%"></div><div class="skel-line skeleton" style="width:50%"></div></div></div>
    <div class="skel-card"><div class="skel-thumb skeleton"></div><div class="skel-body"><div class="skel-line skeleton" style="width:70%"></div><div class="skel-line skeleton" style="width:75%"></div><div class="skel-line skeleton" style="width:35%"></div></div></div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <div class="bnav-items">
      <button class="bnav-item" onclick="location.href='buyer-dashboard.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Home
      </button>
      <button class="bnav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        Browse
      </button>
      <button class="bnav-item" onclick="location.href='orders.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Orders
      </button>
      <button class="bnav-item" onclick="location.href='messages.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Messages
      </button>
      <button class="bnav-item" onclick="location.href='profile.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </button>
    </div>
  </nav>

<script>
  var supa;
  var allGigs = [];
  var activeCategory = 'all';
  var searchQuery = '';

  // Load Supabase
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  s.onload = function() {
    supa = window.supabase.createClient(
      'https://tzzhbzaxoodxbcezcynw.supabase.co',
      'sb_publishable_0Ri0jxyq0AhmIXDInpVi1g_QqqAlOVX'
    );
    initPage();
  };
  document.head.appendChild(s);

  async function initPage() {
    // Auth check
    var { data: { session } } = await supa.auth.getSession();

    // Visitors can browse freely; they're asked to log in only to order or message
    if (!session) {
      var next = encodeURIComponent('browse.html' + location.search);
      document.getElementById('nav-right').innerHTML =
        '<a href="auth.html?mode=login&next=' + next + '" style="font-size:.85rem;font-weight:600;color:var(--charcoal);text-decoration:none;padding:8px 6px;">Log in</a>' +
        '<a href="auth.html?mode=signup&next=' + next + '" style="font-size:.85rem;font-weight:700;color:#fff;background:var(--cyan);text-decoration:none;padding:9px 14px;border-radius:9px;">Join free</a>';
      var bn = document.querySelector('.bottom-nav');
      if (bn) bn.style.display = 'none';
      loadGigs();
      return;
    }

    var { data: { user } } = await supa.auth.getUser();
    var role = user.user_metadata ? user.user_metadata.role : null;
    if (!role) { location.href = 'pick-role.html'; return; }
    if (role === 'seller') {
      var homeBtn = document.querySelector('.bnav-item');
      if (homeBtn) homeBtn.onclick = function() { location.href = 'seller-dashboard.html'; };
      var ordBtn = document.querySelectorAll('.bnav-item')[2];
      if (ordBtn) ordBtn.onclick = function() { location.href = 'seller-orders.html'; };
    }

    // Avatar
    var meta = user.user_metadata || {};
    var fullName = meta.full_name || user.email || '';
    var parts = fullName.split(' ');
    var initials = parts.length >= 2
      ? parts[0][0].toUpperCase() + parts[parts.length-1][0].toUpperCase()
      : fullName.slice(0,2).toUpperCase();
    document.getElementById('nav-avatar').textContent = initials || '?';
    if (meta.avatar_url && /^https:\/\//.test(meta.avatar_url)) {
      document.getElementById('nav-avatar').innerHTML =
        '<img src="' + escHtml(meta.avatar_url) + '" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">';
    }

    // Load gigs
    loadGigs();
  }

  var sellerProfiles = {};

  async function loadGigs() {
    var { data: gigs, error } = await supa
      .from('gigs')
      .select('id, seller_id, seller_name, title, category, short_desc, basic_price, basic_days, status, cover_image, created_at')
      .eq('status', 'active')
      .order('created_at', { ascending: false });

    if (error || !gigs) {
      allGigs = [];
      renderGigs([]);
      return;
    }

    // Seller photos + verification status
    var sellerIds = [];
    gigs.forEach(function(g) { if (g.seller_id && sellerIds.indexOf(g.seller_id) === -1) sellerIds.push(g.seller_id); });
    if (sellerIds.length) {
      var { data: profs } = await supa.from('profiles').select('id, avatar_url, verified').in('id', sellerIds);
      (profs || []).forEach(function(p) { sellerProfiles[p.id] = p; });
    }

    allGigs = gigs;

    // Open a category straight from a link like browse.html?cat=Design
    var wantCat = normalizeCat(new URLSearchParams(location.search).get('cat'));
    if (wantCat && CAT_KEYS.indexOf(wantCat) !== -1) {
      document.querySelectorAll('.cat-pill').forEach(function(p) {
        var on = p.dataset.cat === wantCat;
        p.classList.toggle('active', on);
        if (on) { activeCategory = wantCat; p.scrollIntoView({ inline: 'center', block: 'nearest' }); }
      });
    }
    applyFilters();
  }

  // Categories are stored on gigs as keys like 'graphic-design'.
  // This maps older names and home-page links onto those keys.
  var CAT_KEYS = ['programming','graphic-design','digital-marketing','content-writing','video-animation','ai-services','music-audio','business','consulting'];
  var CAT_ALIASES = {
    'development': 'programming', 'web-development': 'programming', 'tech': 'programming',
    'design': 'graphic-design', 'ui-ux': 'graphic-design', 'graphics': 'graphic-design',
    'marketing': 'digital-marketing',
    'writing': 'content-writing', 'content': 'content-writing',
    'video': 'video-animation', 'video-editing': 'video-animation', 'animation': 'video-animation',
    'ai': 'ai-services',
    'music': 'music-audio', 'audio': 'music-audio'
  };
  function normalizeCat(c) {
    if (!c) return '';
    var k = String(c).toLowerCase().trim().replace(/[\s_&\/]+/g, '-');
    if (CAT_KEYS.indexOf(k) !== -1) return k;
    if (CAT_ALIASES[k]) return CAT_ALIASES[k];
    for (var i = 0; i < CAT_KEYS.length; i++) { if (k.indexOf(CAT_KEYS[i]) !== -1) return CAT_KEYS[i]; }
    for (var a in CAT_ALIASES) { if (k.indexOf(a) !== -1) return CAT_ALIASES[a]; }
    return k;
  }

  function applyFilters() {
    var sort = document.getElementById('sort-select').value;
    var filtered = allGigs.slice();

    // Category filter
    if (activeCategory !== 'all') {
      filtered = filtered.filter(function(g) {
        return normalizeCat(g.category) === activeCategory;
      });
    }

    // Search filter
    if (searchQuery.trim()) {
      var q = searchQuery.trim().toLowerCase();
      filtered = filtered.filter(function(g) {
        return (g.title && g.title.toLowerCase().includes(q)) ||
               (g.short_desc && g.short_desc.toLowerCase().includes(q)) ||
               (g.category && g.category.toLowerCase().includes(q)) ||
               (g.seller_name && g.seller_name.toLowerCase().includes(q));
      });
    }

    // Sort
    if (sort === 'price_asc') {
      filtered.sort(function(a, b) { return (a.basic_price || 0) - (b.basic_price || 0); });
    } else if (sort === 'price_desc') {
      filtered.sort(function(a, b) { return (b.basic_price || 0) - (a.basic_price || 0); });
    }
    // newest: already ordered by created_at desc from DB

    renderGigs(filtered);
  }

  var categoryColors = {
    'design': '#8b5cf6',
    'graphic design': '#8b5cf6',
    'logo design': '#8b5cf6',
    'ui/ux': '#8b5cf6',
    'development': '#0ea5e9',
    'web development': '#0ea5e9',
    'app development': '#0ea5e9',
    'programming': '#0ea5e9',
    'writing': '#f59e0b',
    'writing & content': '#f59e0b',
    'video': '#ef4444',
    'video & animation': '#ef4444',
    'marketing': '#10b981',
    'music': '#ec4899',
    'music & audio': '#ec4899',
    'photography': '#f97316',
    'business': '#6366f1'
  };

  var categoryEmoji = {
    'design': '🎨',
    'development': '💻',
    'writing': '✍️',
    'video': '🎬',
    'marketing': '📣',
    'music': '🎵',
    'photography': '📷',
    'business': '📊'
  };

  var categoryBg = {
    'design': '#f5f3ff',
    'development': '#f0f9ff',
    'writing': '#fffbeb',
    'video': '#fff1f2',
    'marketing': '#f0fdf4',
    'music': '#fdf2f8',
    'photography': '#fff7ed',
    'business': '#eef2ff'
  };

  // Map any category string to a base key by checking which key appears in it
  var baseKeys = ['design','development','writing','video','marketing','music','photography','business'];
  function getCatKey(cat) {
    if (!cat) return '';
    var lower = cat.toLowerCase();
    // exact match first
    if (categoryColors[lower]) return lower;
    // then find which base key the category contains
    for (var i = 0; i < baseKeys.length; i++) {
      if (lower.indexOf(baseKeys[i]) !== -1) return baseKeys[i];
    }
    return lower;
  }

  function escHtml(str) {
    return String(str || '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function sellerInitials(name) {
    if (!name) return '?';
    var parts = name.trim().split(' ');
    if (parts.length >= 2) return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
    return name.slice(0,2).toUpperCase();
  }

  function renderGigs(gigs) {
    var grid = document.getElementById('gig-grid');
    var count = document.getElementById('result-count');

    if (gigs.length === 0) {
      var msg = activeCategory !== 'all' || searchQuery
        ? 'No gigs match your search. Try a different keyword or category.'
        : 'No gigs have been published yet. Check back soon!';
      count.textContent = '0 gigs found';
      grid.innerHTML = '<div class="empty">' +
        '<div class="empty-icon">🔍</div>' +
        '<div class="empty-title">Nothing here yet</div>' +
        '<div class="empty-sub">' + msg + '</div>' +
        '</div>';
      return;
    }

    count.textContent = gigs.length + (gigs.length === 1 ? ' gig found' : ' gigs found');

    var html = '';
    gigs.forEach(function(gig) {
      var catKey = getCatKey(gig.category);
      var color = categoryColors[catKey] || '#64748b';
      var emoji = categoryEmoji[catKey] || '💼';
      var bg = categoryBg[catKey] || '#f8fafc';
      var price = gig.basic_price ? '$' + Number(gig.basic_price).toLocaleString() : '—';
      var days = gig.basic_days ? gig.basic_days + ' day' + (gig.basic_days > 1 ? 's' : '') : '';
      var initials = sellerInitials(gig.seller_name);
      var sp = sellerProfiles[gig.seller_id] || {};
      var titleShort = (gig.title || 'Untitled gig');

      var thumbHtml = gig.cover_image
        ? '<img src="' + escHtml(gig.cover_image) + '" alt="" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:0;">'
        : emoji;

      html += '<div class="gig-card" onclick="openGig(\'' + gig.id + '\')">' +
        '<div class="gig-thumb" style="background:' + bg + ';">' + thumbHtml + '</div>' +
        '<div class="gig-body">' +
          '<div class="gig-seller-row">' +
            (sp.avatar_url && /^https:\/\//.test(sp.avatar_url)
              ? '<div class="seller-avatar" style="background:' + color + ';overflow:hidden;"><img src="' + escHtml(sp.avatar_url) + '" alt="" style="width:100%;height:100%;object-fit:cover;"></div>'
              : '<div class="seller-avatar" style="background:' + color + ';">' + escHtml(initials) + '</div>') +
            '<span class="seller-name">' + escHtml(gig.seller_name || 'Seller') + '</span>' +
            (sp.verified ? '<span class="verified">✓ Verified</span>' : '') +
          '</div>' +
          '<div class="gig-title">' + escHtml(titleShort) + '</div>' +
          '<div class="gig-footer">' +
            '<div class="gig-price">From ' + price + ' <span>/ gig</span></div>' +
            (days ? '<div class="gig-days">' + escHtml(days) + '</div>' : '') +
          '</div>' +
        '</div>' +
      '</div>';
    });
    grid.innerHTML = html;
  }

  function openGig(gigId) {
    location.href = 'gig.html?id=' + gigId;
  }

  // Category pills
  document.getElementById('cats-wrap').addEventListener('click', function(e) {
    var pill = e.target.closest('.cat-pill');
    if (!pill) return;
    document.querySelectorAll('.cat-pill').forEach(function(p) { p.classList.remove('active'); });
    pill.classList.add('active');
    activeCategory = pill.dataset.cat;
    applyFilters();
  });

  // Search
  var searchInput = document.getElementById('search-input');
  var searchClear = document.getElementById('search-clear');
  var searchTimer;

  searchInput.addEventListener('input', function() {
    searchQuery = searchInput.value;
    searchClear.style.display = searchQuery ? 'block' : 'none';
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilters, 300);
  });

  function clearSearch() {
    searchInput.value = '';
    searchQuery = '';
    searchClear.style.display = 'none';
    searchInput.focus();
    applyFilters();
  }
</script>
